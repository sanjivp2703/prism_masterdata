# SPCS service specification for the Prism native edition (Phase N2 — bare
# service in the dev account, NOT yet a Native App package; N3 moves this into
# the application package).
#
# Upload to the stage referenced by native/spcs-dev-setup.sql, then:
#   CREATE SERVICE ... FROM @PRISM_DB.INTERNAL.NATIVE_ARTIFACTS SPECIFICATION_FILE='service-spec.yaml'
#
# The image path must match your account's image repository — see
# native/push.sh (SPCS pulls from the repo created in spcs-dev-setup.sql).
spec:
  containers:
    - name: prism
      image: /prism_db/internal/prism_images/prism-native:latest
      env:
        # Ambient SPCS auth (SNOWFLAKE_HOST / SNOWFLAKE_ACCOUNT / the token
        # file) is injected by the platform — do NOT set credentials here.
        SNOWFLAKE_WAREHOUSE: PRISM_APP_WH
        PRISM_SQLITE_PATH: /data/prism.db
        # No secrets here — the native edition self-provisions
        # SESSION_SECRET / PRISM_ENCRYPTION_KEY at first boot and persists
        # them on the block volume (instrumentation.ts ensureNativeSecrets).
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 2
          memory: 4Gi
  volumes:
    # Block volume: durable across restarts — holds the SQLite app state
    # (docs/NATIVE_APP_PLAN.md §2.5). The N0 spike validates this mechanism.
    - name: data
      source: block
      size: 10Gi
  endpoints:
    - name: app
      port: 8000
      public: true
# Caller's rights (docs/NATIVE_APP_PLAN.md §2.9): with executeAsCaller on,
# Snowflake attaches the ingress user's token to every request
# (Sf-Context-Current-User-Token header). Interactive operations — one-time
# standardization, table probing, baseline creation, picker suggestions — run
# as the CALLING USER (their privileges ∩ the consumer's opt-in caller
# grants). Background work (poller/tick) has no caller and stays on the
# service identity. NOTE: `capabilities` is a TOP-LEVEL key, sibling of
# `spec`, not nested inside it.
capabilities:
  securityContext:
    executeAsCaller: true
