# Snowflake Native App manifest — Prism (docs/NATIVE_APP_PLAN.md N3).
# DRAFT: authored 2026-08-13, not yet install-tested. Version/artifact paths
# get finalized when the application package is first created.
manifest_version: 1

version:
  name: v1_0
  label: "Prism 1.0"
  comment: "Warehouse-native data standardization"

lifecycle_callbacks:
  # Runs on every install/upgrade (incl. background auto-upgrades after a
  # release-directive move): rolls the running service onto this version's
  # image/spec. Guarded no-op on first install. Manual fallback: upgrade_app().
  version_initializer: app_code.version_init

configuration:
  # Snowsight calls this as the consumer grants the account privileges in the
  # permission UI. Once all three are held it runs start_app(), so the
  # listing install brings the service up with no worksheet step — without
  # it, Snowsight's activation looks for the default_web_endpoint service,
  # finds none, and fails with "SPCS Activation Error" (found live 2026-08-31
  # on the first-ever listing-path install).
  grant_callback: app_code.grant_callback

artifacts:
  setup_script: setup.sql
  readme: README.md
  default_web_endpoint:
    service: services.prism_app
    endpoint: app
  container_services:
    images:
      - /prism_db/internal/prism_images/prism-native:latest   # repo path finalized at packaging

# Caller's rights (§2.9): the service spec sets executeAsCaller, and the
# consumer OPTS IN with caller grants (GRANT CALLER / GRANT INHERITED CALLER
# ... TO APPLICATION — needs MANAGE CALLER GRANTS). Declared here so the
# install UI discloses it. VERIFY at the next install test: this block is
# documented for EXECUTE AS RESTRICTED CALLER procedures — if the validator
# rejects it for a containers-only app, drop the block (the consumer-side
# caller grants + service-spec capability are what actually power it).
restricted_callers_rights:
  enabled: true
  description: "Optional: lets Prism clean any table the signed-in user can already read (one-time standardization, table preview) using that user's own access. Background pipelines never use it."

privileges:
  - CREATE COMPUTE POOL:
      description: "Run Prism's application container (single small node)."
  - CREATE WAREHOUSE:
      description: "Create the dedicated PRISM_WH warehouse (XSMALL, auto-suspend 60s) so Prism's compute cost is isolated and attributable."
  - BIND SERVICE ENDPOINT:
      description: "Serve Prism's web interface through a Snowflake-authenticated URL."
  # Owner decision 2026-08-31: requested so the /setup database picker can
  # list database NAMES before any data grant exists (fresh installs see
  # nothing otherwise — the picker's type-in remains the fallback when this
  # is declined). Grants read on account-usage metadata views, NOT on any
  # table data. Revisit at Marketplace security review if it draws findings.
  - IMPORTED PRIVILEGES ON SNOWFLAKE DB:
      description: "Lets Prism's setup page list your database names in its picker. Metadata only — grants no access to any table's data."
  # Cortex: the consumer additionally grants the SNOWFLAKE.CORTEX_USER
  # database role via /setup (a database role cannot be manifest-requested).
  # All AI runs in-account — no data leaves Snowflake.

# References (owner decision 2026-09-01, reversing the 2026-08-31 "no
# references" call): ONE optional multi-valued TABLE reference for pipeline
# sources, so a consumer can grant per-table SELECT with clicks in Snowsight's
# Security tab instead of running GRANT SQL. Nothing is required_at_setup —
# the install still asks for no per-table access up front, and the direct
# `GRANT SELECT ... TO APPLICATION` SQL path remains fully supported (and is
# the schema-scoped convenience path).
#
# What the reference deliberately does NOT cover (physics of the framework):
#   - Change tracking: ALTER is not a legal TABLE-reference privilege, so
#     `ALTER TABLE ... SET CHANGE_TRACKING = TRUE` stays a consumer-run
#     statement (the app's panels surface it next to the reference steps).
#   - Export destinations: SCHEMA is not a referenceable object_type
#     (validator, 2026-08-13), so USAGE + CREATE TABLE on the output schema
#     stay direct grants where the export lands in a consumer schema.
#   - WRITE to consumer tables: never requested; Column output mode remains
#     off in this edition (the server refuses export_kind='column').
# Caller's rights (above) still powers interactive per-user reads; the
# reference exists for the background poller, which has no user session.
#
# ⚠ VERIFY at the next install test (undocumented in Snowflake's reference
# docs): CREATE STREAM ... ON TABLE reference('source_table','<alias>') — the
# whole pipeline path depends on it. DESCRIBE TABLE reference(...) and
# DML/SELECT through references are documented and relied on.
references:
  - source_table:
      label: "Pipeline source tables"
      # Validator caps reference descriptions at 200 chars (live-found, patch 51 cut).
      description: "Tables Prism watches and standardizes as live pipelines. Adding a table grants the app SELECT on it only. Change tracking must still be enabled per table (Prism shows the one-line ALTER)."
      privileges:
        - SELECT
      object_type: TABLE
      multi_valued: true
      register_callback: app_code.register_reference
